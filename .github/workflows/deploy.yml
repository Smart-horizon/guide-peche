name: Deploy to Cloudflare Workers

on:
  # Déclenché par le webhook Sanity lors d'une publication
  repository_dispatch:
    types: [sanity-publish, sanity-deploy]
  # Déclenché aussi sur chaque push sur main (ex: modif de code)
  push:
    branches: [main]
  # Permet de déclencher manuellement depuis l'onglet Actions de GitHub
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Masquer les pages hardcodées de référence (identique à deploy.sh)
        run: |
          # Aligné sur deploy.sh : on masque UNIQUEMENT le dossier de référence
          # src/pages/old/. Toutes les autres pages (EN, newsletter, etc.) sont
          # de vraies pages qui DOIVENT être déployées.
          rm -rf src/pages/old
          echo "  src/pages/old retiré (pages de référence hardcodées)"

      - name: Build Astro
        run: npm run build
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}

      - name: Patch wrangler.json (run_worker_first)
        run: |
          node -e "
            const fs = require('fs');
            const p = 'dist/server/wrangler.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            cfg.assets = cfg.assets || {};
            cfg.assets.run_worker_first = true;
            fs.writeFileSync(p, JSON.stringify(cfg));
            console.log('  ok run_worker_first = true');
          "

      - name: Deploy vers Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e1c99d02d3183b6fe3a4f517bb657e54
