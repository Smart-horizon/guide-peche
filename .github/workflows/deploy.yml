name: Deploy to Cloudflare Workers

on:
  # Déclenché par le webhook Sanity lors d'une publication
  repository_dispatch:
    types: [sanity-publish, sanity-deploy]
  # Déclenché aussi sur chaque push sur main (ex: modif de code)
  push:
    branches: [main]
  # Permet de déclencher manuellement depuis l'onglet Actions de GitHub
  workflow_dispatch:

# Un seul déploiement à la fois : un nouveau run annule le précédent encore
# en cours, évitant qu'un ancien build n'écrase le plus récent (last-writer-wins).
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}

      - name: Patch wrangler.json (run_worker_first + exclusions 301)
        run: node patch-wrangler.cjs

      - name: Deploy vers Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e1c99d02d3183b6fe3a4f517bb657e54

  # ── Worker d'APERÇU (Sanity Presentation) — SSR + brouillons + overlays ──────
  # Job séparé : un échec ici ne bloque PAS le déploiement du site public.
  deploy-preview:
    name: Build & Deploy — Aperçu Sanity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Deploy worker d'aperçu
        run: bash deploy-preview.sh
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e1c99d02d3183b6fe3a4f517bb657e54

  # ── Contrôle : l'aperçu doit rendre comme le site publié ─────────────────────
  # Attend que les DEUX workers soient déployés, puis compare leur structure.
  # Attrape la classe de bug qu'aucun build ne révèle : une comparaison de chaîne
  # Sanity cassée par le stega (l'aperçu diverge en silence), ou un worker
  # d'aperçu qui tombe en CPU alors que le site public, statique, va bien.
  # ⚠️ Ne conclut PAS si un brouillon est en cours : la différence est alors
  # normale. Voir scripts/verifier-apercu.mjs.
  verifier-apercu:
    name: Contrôle — aperçu = publié
    runs-on: ubuntu-latest
    needs: [deploy, deploy-preview]
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Le temps que les deux workers soient réellement servis en périphérie.
      - name: Laisser les workers se propager
        run: sleep 25

      # Aucune dépendance : le script n'utilise que fetch (natif Node 24).
      - name: Comparer aperçu et site publié
        run: node scripts/verifier-apercu.mjs
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
