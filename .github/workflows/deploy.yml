name: Deploy to Cloudflare Workers

on:
  # Déclenché par le webhook Sanity lors d'une publication
  repository_dispatch:
    types: [sanity-publish, sanity-deploy]
  # Déclenché aussi sur chaque push sur main (ex: modif de code)
  push:
    branches: [main]
  # Permet de déclencher manuellement depuis l'onglet Actions de GitHub
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Supprimer les pages hardcodées (comparaison locale uniquement)
        run: |
          KEEP=(
            "src/pages/index.astro"
            "src/pages/[slug].astro"
            "src/pages/contact.astro"
            "src/pages/temoignages.astro"
            "src/pages/tarifs.astro"
            "src/pages/disponibilites-guidages.astro"
            "src/pages/bon-cadeau.astro"
            "src/pages/videos.astro"
            "src/pages/voyages-peche-mouche.astro"
            "src/pages/blog/index.astro"
            "src/pages/blog/[slug].astro"
          )

          for file in $(git ls-files src/pages/ | grep "\.astro$"); do
            keep=false
            for k in "${KEEP[@]}"; do
              [ "$file" = "$k" ] && keep=true && break
            done
            if [ "$keep" = false ] && [ -f "$file" ]; then
              rm "$file"
              echo "  Supprime: $file"
            fi
          done

      - name: Build Astro
        run: npm run build
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}

      - name: Deploy vers Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e1c99d02d3183b6fe3a4f517bb657e54
